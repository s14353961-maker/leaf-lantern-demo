<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Leaf & Lantern: a demo tea shop with catalog, cart, checkout and admin dashboard.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Leaf &amp; Lantern Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: storefront = sticky header + promo strip + filter row + product grid, with a cart drawer and modal;
   admin = side nav + operational panels. Tea-shop identity: jade green, hibiscus plum for offers, drawn tea tins. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E8EEE9; --fg:#14201A; --muted:#55655C; --line:#D2DBD4;
  --accent:#1D6A50; --accent-hover:#16573F; --accent-fg:#FFFFFF; --accent-soft:#D8E9DE; --accent-mid:#8FC1A6;
  --plum:#913460; --plum-soft:#F4E0E9;
  --ok:#2C7537; --ok-soft:#DCEEDE; --warn:#8C6000; --warn-soft:#F5EACB; --bad:#AE3A2E; --bad-soft:#F6DDD9; --info:#2A5DA5; --info-soft:#DCE6F5;
  --overlay:rgba(12,20,16,.48);
  --shadow:0 1px 2px rgba(20,32,26,.06),0 10px 30px rgba(20,32,26,.10);
  --tile-s:32%; --tile-l:88%; --obj-l:40%; --obj-l2:28%; --label-l:96%;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#151F1A; --surface-2:#1C2923; --fg:#E4EDE7; --muted:#93A59A; --line:#2A3832;
  --accent:#5DC39B; --accent-hover:#79D2AE; --accent-fg:#08130E; --accent-soft:#1B3A2D; --accent-mid:#2F6B52;
  --plum:#E58BB6; --plum-soft:#3A1F2C;
  --ok:#7ACB86; --ok-soft:#1D3522; --warn:#E3B653; --warn-soft:#3A3018; --bad:#F08E83; --bad-soft:#3E201C; --info:#8DB4F0; --info-soft:#1C2A40;
  --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  --tile-l:21%; --obj-l:52%; --obj-l2:38%; --label-l:84%; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#151F1A; --surface-2:#1C2923; --fg:#E4EDE7; --muted:#93A59A; --line:#2A3832;
  --accent:#5DC39B; --accent-hover:#79D2AE; --accent-fg:#08130E; --accent-soft:#1B3A2D; --accent-mid:#2F6B52;
  --plum:#E58BB6; --plum-soft:#3A1F2C;
  --ok:#7ACB86; --ok-soft:#1D3522; --warn:#E3B653; --warn-soft:#3A3018; --bad:#F08E83; --bad-soft:#3E201C; --info:#8DB4F0; --info-soft:#1C2A40;
  --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  --tile-l:21%; --obj-l:52%; --obj-l2:38%; --label-l:84%; color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;line-height:1.2;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-accent:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-sm{padding:7px 13px;font-size:13px}
.btn-block{width:100%;padding:13px 18px;font-size:15px}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:999px;border:1px solid transparent;background:transparent;position:relative}
.iconbtn:hover{background:var(--surface-2)}
.linklike{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left}
.linklike:hover{color:var(--accent)}
.input,.select,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-width:0}
.input:focus,.select:focus{outline:2px solid var(--accent-mid);outline-offset:0;border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.field.has-err .input,.field.has-err .select{border-color:var(--bad)}
.err{font-size:13px;color:var(--bad)}
.hint{font-size:13px;color:var(--muted)}

/* Demo bar */
.demobar{background:var(--fg);color:var(--bg)}
.demobar .wrap{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:8px;font-size:13px}
.demobar .tag{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px;border:1px solid currentColor;border-radius:999px;padding:2px 8px;opacity:.85}
.demobar .note{opacity:.75;flex:1 1 220px;min-width:0}
.seg{display:inline-flex;background:color-mix(in srgb,var(--bg) 14%,transparent);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:inherit;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg)}
.demobar .reset{background:transparent;border:0;color:inherit;opacity:.75;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.demobar .reset:hover{opacity:1}
.demobar .reset.armed{opacity:1;color:var(--plum-soft);font-weight:700}

/* Shop header */
.shop-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.shop-head .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.logo{width:32px;height:32px;flex:none}
.lg-a{fill:var(--fg)} .lg-b{fill:var(--accent)} .lg-c{fill:var(--accent-fg)}
.search{flex:1;display:flex;align-items:center;gap:8px;max-width:440px;margin-left:auto;background:var(--surface-2);border-radius:999px;padding:0 14px;min-width:0}
.search input{border:0;background:transparent;padding:10px 0;width:100%;min-width:0;outline:none}
.search:focus-within{outline:2px solid var(--accent-mid)}
.head-actions{display:flex;align-items:center;gap:4px}
.count{position:absolute;top:2px;right:0;background:var(--plum);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.promo-strip{background:var(--accent);color:var(--accent-fg);font-size:13.5px;font-weight:500;text-align:center}
.promo-strip .wrap{padding-block:8px}

/* Intro + filters */
.intro{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end;padding-block:30px 18px}
.intro h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;line-height:1.05}
.intro p{color:var(--muted);margin:10px 0 0;max-width:52ch}
.offer{border:1px dashed var(--plum);background:var(--plum-soft);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center}
.offer b{font-family:var(--f-mono);letter-spacing:.04em;color:var(--plum)}
.offer .t{font-size:14px}
.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:6px 18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip .n{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.sortbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sortbox .select{width:auto;padding:7px 10px;border-radius:999px}

/* Product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card-art{border:0;padding:0;background:none;position:relative;display:block;width:100%}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--fg);letter-spacing:.01em}
.badge.sale{background:var(--plum);color:#fff}
.badge.new{background:var(--accent);color:var(--accent-fg)}
.badge.low{background:var(--warn-soft);color:var(--warn)}
.badge.out{background:var(--fg);color:var(--bg)}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px;flex:1}
.card-meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.card-title{font-size:17px;font-weight:650;line-height:1.25}
.card-origin{font-size:13.5px;color:var(--muted)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px}
.price{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.price s{font-weight:500;color:var(--muted);font-size:13.5px;margin-left:6px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);margin-bottom:40px}
.empty h3{color:var(--fg);font-size:20px;margin-bottom:6px}

/* Art */
.art{display:block;width:100%;height:auto;aspect-ratio:5/4;max-width:100%}
.art .bg{fill:hsl(var(--h) var(--tile-s) var(--tile-l))}
.art .sh{fill:hsl(var(--h) var(--tile-s) calc(var(--tile-l) - 6%))}
.art .o1{fill:hsl(var(--h) 36% var(--obj-l))}
.art .o2{fill:hsl(var(--h) 40% var(--obj-l2))}
.art .lb{fill:hsl(var(--h) 28% var(--label-l))}
.art .gl{fill:hsl(var(--h) 22% var(--label-l));opacity:.55}
.art .ln{fill:none;stroke:hsl(var(--h) 36% var(--obj-l));stroke-width:8;stroke-linecap:round}
.art .st{fill:none;stroke:hsl(var(--h) 20% var(--label-l));stroke-width:3;stroke-linecap:round;opacity:.8}

/* Overlay, modal, drawer */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex}
.overlay.modal{align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay.drawer{justify-content:flex-end}
.panel{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.modal-panel{border-radius:16px;width:min(880px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.drawer-panel{width:min(420px,100%);height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.pd-art{position:relative}
.pd-art .art{height:100%;aspect-ratio:auto;min-height:280px}
.pd-body{padding:26px 26px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pd-body h2{font-size:28px;font-weight:800;line-height:1.1}
.stars{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.stars svg{width:14px;height:14px;fill:var(--warn)}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.specs dt{color:var(--muted)} .specs dd{margin:0;font-weight:500}
.pd-buy{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pd-buy .btn{flex:1}
.related{border-top:1px solid var(--line);padding-top:12px}
.related-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.rel{border:0;background:none;padding:0;text-align:left;font-size:13px;display:flex;flex-direction:column;gap:4px}
.rel .art{border-radius:8px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:40px}
.stepper button{border:0;background:none;width:36px;height:100%;display:grid;place-items:center;border-radius:999px}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper .num{min-width:24px;text-align:center;font-weight:600}
.stepper.sm{height:32px} .stepper.sm button{width:30px}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:20px}
.dr-body{flex:1;overflow:auto;padding:8px 18px}
.dr-foot{border-top:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.line:last-child{border-bottom:0}
.line .art{border-radius:8px;aspect-ratio:1}
.line-name{font-weight:600;font-size:14.5px;line-height:1.3}
.line-sub{font-size:12.5px;color:var(--muted)}
.line-ctl{display:flex;align-items:center;gap:8px;margin-top:6px}
.line-price{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.remove{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;padding:2px}
.ship-meter{font-size:13px;color:var(--muted)}
.ship-meter .bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.ship-meter .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.coupon{display:flex;gap:8px}
.coupon .input{text-transform:uppercase;font-family:var(--f-mono);font-size:14px}
.applied{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r-sm);padding:8px 12px;font-size:13.5px}
.applied b{font-family:var(--f-mono)}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin:0}
.totals dt{color:var(--muted)} .totals dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.totals .disc{color:var(--plum)}
.totals .grand{font-size:17px;font-weight:700;color:var(--fg);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}

/* Checkout */
.page{padding-block:26px 50px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--muted);font-weight:500;margin-bottom:12px}
.back:hover{color:var(--fg)}
.co{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
.co h1{font-size:30px;font-weight:800;margin-bottom:4px}
.co-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;margin-top:16px}
.co-sec h2{font-size:17px;font-weight:650;display:flex;align-items:center;gap:10px}
.step-n{width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:12px;display:grid;place-items:center;font-family:var(--f-body);font-weight:700}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt .t{font-weight:600;font-size:14.5px}
.opt .d{font-size:13px;color:var(--muted)}
.opt .r{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.testcard{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:var(--muted);margin-top:8px}
.testcard .mono{color:var(--fg)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.summary h2{font-size:17px}
.fill-sample{align-self:flex-start;font-size:13px;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Confirmation & my orders */
.done{max-width:640px;margin:0 auto;text-align:left}
.done-mark{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin-bottom:16px}
.done-mark .ic{width:26px;height:26px;stroke-width:2.4}
.done h1{font-size:32px;font-weight:800}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:20px 0;display:flex;flex-direction:column;gap:12px}
.receipt-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.rline{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.done-actions{display:flex;gap:10px;flex-wrap:wrap}
.olist{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.ocard .items{font-size:13.5px;color:var(--muted);grid-column:1/-1}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-Pending{background:var(--warn-soft);color:var(--warn)}
.st-Paid{background:var(--accent-soft);color:var(--accent)}
.st-Shipped{background:var(--info-soft);color:var(--info)}
.st-Delivered{background:var(--ok-soft);color:var(--ok)}
.st-Cancelled{background:var(--bad-soft);color:var(--bad)}

function Art({ p, steam }){

    <rect className="lb" x="78" y="76" width="44" height="36" rx="3"/><circle className="o2" cx="100" cy="94" r="7"/>`;

  else if (s === 'cup') body = html`<ellipse className="o2" cx="100" cy="133" rx="58" ry="8"/><path className="ln" d="M133 86q20 1 14 19q-4 9-17 9"/>
    <path className="o1" d="M64 76H136Q134 128 100 128Q66 128 64 76Z"/><ellipse className="lb" cx="100" cy="76" rx="36" ry="6"/>
    <path className="st" d="M88 60q-6-8 0-16M100 58q-6-8 0-16M112 60q-6-8 0-16"/>`;
  else if (s === 'pot') body = html`<rect className="o2" x="26" y="92" width="30" height="11" rx="5.5"/><path className="o1" d="M139 95L171 80L167 91L141 112Z"/>
    <ellipse className="o1" cx="100" cy="100" rx="45" ry="37"/><rect className="o2" x="81" y="57" width="38" height="11" rx="4"/><circle className="o2" cx="100" cy="53" r="5"/>

    <rect className="bg" width="200" height="160"/><ellipse className="sh" cx="100" cy="140" rx="54" ry="7"/>${body}</svg>`;

function Stepper({ value, min, max, onChange, label, small }){
  min = min == null ? 1 : min;
  return html`<div className=${'stepper' + (small ? ' sm' : '')} role="group" aria-label=${label}>
    <button type="button" onClick=${() => onChange(Math.max(min, value - 1))} disabled=${value <= min} aria-label="Decrease quantity"><${Icon} n="minus"/></button>
    <span className="num" aria-live="polite">${value}</span>
    <button type="button" onClick=${() => onChange(Math.min(max, value + 1))} disabled=${value >= max} aria-label="Increase quantity"><${Icon} n="plus"/></button></div>`;
}
function Overlay({ onClose, kind, label, children }){
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', k);
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', k); document.body.style.overflow = prev; };
  }, []);
  return html`<div className=${'overlay ' + kind} onMouseDown=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className=${'panel ' + kind + '-panel'} role="dialog" aria-modal="true" aria-label=${label}>${children}</div></div>`;
}

function CartDrawer({ q, products, code, setCode, onQty, onRemove, onClose, onCheckout, coupons }){
  const [input, setInput] = useState('');
  const [err, setErr] = useState('');
  const apply = e => {
    e.preventDefault();
    const c = input.trim().toUpperCase();
    if (!c) return;
    const t = quote(q.lines.map(l => ({ id: l.id, qty: l.qty })), products, coupons, c);
    if (t.couponError) { setErr(t.couponError); return; }
    setCode(c); setInput(''); setErr('');
  };
  const toFree = FREE_SHIP - q.subtotal;
  return html`<${Overlay} kind="drawer" label="Your cart" onClose=${onClose}>
    <div className="dr-head"><h2>Your cart</h2><button className="iconbtn" onClick=${onClose} aria-label="Close cart"><${Icon} n="x"/></button></div>

    <div className="dr-body">

        <${Art} p=${l.p}/>

      </div>`)}
    </div>
    <div className="dr-foot">
      <div className="ship-meter">${toFree > 0 ? html`Add <b>${money(toFree)}</b> more for free shipping` : html`<b>You’ve unlocked free shipping</b>`}
        <div className="bar"><i style=${{ width: Math.min(100, q.subtotal / FREE_SHIP * 100) + '%' }}></i></div></div>
      ${code && !q.couponError ? html`<div className="applied"><span><b>${code}</b> · ${couponRule(q.coupon)}</span><button className="remove" onClick=${() => setCode(null)}>Remove</button></div>` : html`
        <form className="coupon" onSubmit=${apply}>
          <label htmlFor="coupon-input" className="sr">Discount code</label>
          <input id="coupon-input" className="input" placeholder="Discount code" value=${input} onChange=${e => { setInput(e.target.value); setErr(''); }}/>

      <${Totals} q=${q}/>
      <button className="btn btn-accent btn-block" onClick=${onCheckout}><${Icon} n="lock"/>Checkout · ${money(q.total)}</button>
    </div>`}
  <//>`;
}

const EMPTY_FORM = { email: '', name: '', address: '', city: '', postcode: '', country: 'Malaysia', delivery: 'standard', payment: 'card', offers: true };

function Checkout({ cart, products, coupons, code, setCode, onBack, onPlace }){
  const [f, setF] = useState(EMPTY_FORM);
  const [errs, setErrs] = useState({});
  const [busy, setBusy] = useState(false);
  const q = quote(cart, products, coupons, code, f.delivery);
  const set = k => e => { const v = e.target.type === 'checkbox' ? e.target.checked : e.target.value; setF(s => Object.assign({}, s, { [k]: v })); setErrs(s => Object.assign({}, s, { [k]: null })); };
  const submit = e => {
    e.preventDefault();
    const er = {};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) er.email = 'Enter an email like name@example.com.';
    ['name', 'address', 'city'].forEach(k => { if (!f[k].trim()) er[k] = 'This field is required.'; });
    if (!/^[A-Za-z0-9 -]{3,10}$/.test(f.postcode.trim())) er.postcode = 'Enter a valid postcode.';
    setErrs(er);
    if (Object.keys(er).length) { const first = document.getElementById('co-' + Object.keys(er)[0]); if (first) first.focus(); return; }
    setBusy(true);
    setTimeout(() => onPlace(f, q), 1300);
  };
  const F = (k, label, props) => html`<div className=${'field' + (errs[k] ? ' has-err' : '')}>
    <label htmlFor=${'co-' + k}>${label}</label>
    <input id=${'co-' + k} className="input" value=${f[k]} onChange=${set(k)} aria-invalid=${!!errs[k]} ...${props || {}}/>

  if (!q.lines.length) return html`<div className="page wrap gutter"><button className="back" onClick=${onBack}><${Icon} n="back"/>Back to shop</button>
    <div className="empty"><h3>Nothing to check out yet</h3>Your cart is empty.</div></div>`;
  return html`<div className="page gutter"><div className="wrap">
    <button className="back" onClick=${onBack}><${Icon} n="back"/>Back to shop</button>
    <form className="co" onSubmit=${submit} noValidate>
      <div>
        <h1>Checkout</h1>
        <button type="button" className="fill-sample" onClick=${() => { setF(SAMPLE_FORM); setErrs({}); }}>Fill with sample details</button>
        <section className="co-sec"><h2><span className="step-n">1</span>Contact</h2>

          <label className="check"><input type="checkbox" id="co-offers" checked=${f.offers} onChange=${set('offers')}/>Email me new teas and offers</label>
        </section>
        <section className="co-sec"><h2><span className="step-n">2</span>Shipping address</h2>
          ${F('name', 'Full name', { autoComplete: 'name' })}
          ${F('address', 'Address', { autoComplete: 'street-address' })}
          <div className="row2">${F('city', 'City', { autoComplete: 'address-level2' })}${F('postcode', 'Postcode', { autoComplete: 'postal-code' })}</div>
          <div className="field"><label htmlFor="co-country">Country</label>
            <select id="co-country" className="select" value=${f.country} onChange=${set('country')}>
              ${['Malaysia','Singapore','Australia','United Kingdom','United States','Canada'].map(c => html`<option key=${c}>${c}</option>`)}</select></div>
          <div className="opts" role="radiogroup" aria-label="Delivery">
            <label className="opt"><input type="radio" name="delivery" checked=${f.delivery === 'standard'} onChange=${() => setF(s => Object.assign({}, s, { delivery: 'standard' }))}/>
              <span><div className="t">Standard</div><div className="d">3–5 business days · free over ${money(FREE_SHIP)}</div></span>
              <span className="r">${quote(cart, products, coupons, code, 'standard').shipping === 0 ? 'Free' : money(SHIP_STD)}</span></label>
            <label className="opt"><input type="radio" name="delivery" checked=${f.delivery === 'express'} onChange=${() => setF(s => Object.assign({}, s, { delivery: 'express' }))}/>
              <span><div className="t">Express</div><div className="d">1–2 business days, tracked</div></span><span className="r">${money(SHIP_EXP)}</span></label>
          </div>
        </section>
        <section className="co-sec"><h2><span className="step-n">3</span>Payment</h2>
          <div className="opts" role="radiogroup" aria-label="Payment method">
            ${[['card', 'Credit or debit card', 'Processed by Stripe'], ['paypal', 'PayPal', 'You’ll approve the payment in PayPal'], ['cod', 'Cash on delivery', 'Pay the courier when your order arrives']].map(o => html`
              <label className="opt" key=${o[0]}><input type="radio" name="payment" checked=${f.payment === o[0]} onChange=${() => setF(s => Object.assign({}, s, { payment: o[0] }))}/>
                <span style=${{ flex: 1 }}><div className="t">${o[1]}</div><div className="d">${o[2]}</div>
                ${o[0] === 'card' && f.payment === 'card' ? html`<div className="testcard"><${Icon} n="lock"/><span>Test mode: the demo uses Stripe’s test card <span className="mono">4242 4242 4242 4242</span>. No real card is charged.</span></div>` : null}
                </span></label>`)}

      </div>
      <aside className="summary" aria-label="Order summary">
        <h2>Order summary</h2>
        ${q.lines.map(l => html`<div className="rline" key=${l.id}><span>${l.qty} × ${l.p.name}</span><span className="tab">${money(l.p.price * l.qty)}</span></div>`)}

        <${Totals} q=${q}/>
        <button className="btn btn-accent btn-block" type="submit" disabled=${busy}>

  const [subEmail, setSubEmail] = useState('');
  const [subErr, setSubErr] = useState('');
  const products = store.products;
  const live = products.filter(p => p.active);
  const q = quote(cart, products, store.coupons, code);
  const count = sum(cart, l => l.qty);
  const counts = useMemo(() => { const m = { all: live.length }; live.forEach(p => { m[p.cat] = (m[p.cat] || 0) + 1; }); return m; }, [products]);
  const shown = useMemo(() => {

function niceMax(v){ if (v <= 0) return 10; const e = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * e >= v) return m * e; return 10 * e; }
function RevenueChart({ orders }){
  const today = startOfDay(Date.now()).getTime();
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const t = today - i * DAY;
    const os = orders.filter(o => o.status !== 'Cancelled' && startOfDay(o.date).getTime() === t);
    days.push({ t, v: round2(sum(os, o => o.total)), n: os.length });
  }
  const W = 640, H = 230, L = 46, R = 10, T = 22, B = 30;
  const max = niceMax(Math.max.apply(null, days.map(d => d.v)) * 1.08);
  const y = v => T + (H - T - B) * (1 - v / max);
  const bw = (W - L - R) / days.length;
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => f * max);
  return html`<svg className="chart" viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label="Daily revenue for the last 14 days">
    ${ticks.map(t => html`<g key=${t}><line className="ch-g" x1=${L} x2=${W - R} y1=${y(t)} y2=${y(t)}/><text className="ch-t" x=${L - 8} y=${y(t) + 4} textAnchor="end">$${Math.round(t)}</text></g>`)}
    ${days.map((d, i) => { const x = L + i * bw + bw * 0.18, w = bw * 0.64, isToday = i === days.length - 1;
      return html`<g key=${d.t}>
        <rect className=${'ch-b' + (isToday ? ' today' : '')} x=${x} y=${y(d.v)} width=${w} height=${Math.max(0, y(0) - y(d.v))} rx="3"><title>${fmtDate(d.t)}: ${money(d.v)} from ${d.n} orders</title></rect>
        ${i % 2 === 1 ? html`<text className="ch-t" x=${x + w / 2} y=${H - 10} textAnchor="middle">${isToday ? 'Today' : fmtDate(d.t)}</text>` : null}
        ${isToday ? html`<text className="ch-v" x=${x + w / 2} y=${y(d.v) - 7} textAnchor="middle">${money(d.v)}</text>` : null}</g>`; })}
  </svg>`;
}

function Promotions({ store, setStore, toast }){
  const [ann, setAnn] = useState(store.announcement);
  const [nc, setNc] = useState({ code: '', type: 'percent', value: '', min: '' });
  const [err, setErr] = useState('');
  const active = store.coupons.filter(c => c.active);
  const [send, setSend] = useState(active[0] ? active[0].code : '');
  const toggle = c => { setStore(s => Object.assign({}, s, { coupons: s.coupons.map(x => x.code === c.code ? Object.assign({}, x, { active: !x.active }) : x) })); toast(c.code + (c.active ? ' paused' : ' is active')); };
  const create = e => {
    e.preventDefault();
    const code = nc.code.trim().toUpperCase().replace(/\s+/g, ''), value = parseFloat(nc.value) || 0, min = parseFloat(nc.min) || 0;
    if (!/^[A-Z0-9]{3,15}$/.test(code)) return setErr('Use 3–15 letters or numbers for the code.');
    if (store.coupons.find(c => c.code === code)) return setErr(code + ' already exists.');
    if (nc.type === 'percent' && !(value > 0 && value <= 90)) return setErr('Enter a percentage between 1 and 90.');
    if (nc.type === 'fixed' && !(value > 0)) return setErr('Enter an amount above $0.');
    setStore(s => Object.assign({}, s, { coupons: s.coupons.concat([{ code, type: nc.type, value: nc.type === 'ship' ? 0 : value, min, active: true, uses: 0 }]) }));
    setNc({ code: '', type: 'percent', value: '', min: '' }); setErr(''); toast(code + ' created. Try it in the cart.');
  };
  return html`<div>
    <div className="main-head"><div><h1>Promotions</h1><p>Discount codes, the shop announcement bar and offer emails</p></div></div>
    <div className="panels">
      <div className="stack">
        <div className="tablewrap"><table>
          <thead><tr><th>Code</th><th>Rule</th><th className="r">Uses</th><th>Active</th></tr></thead>
          <tbody>${store.coupons.map(c => html`<tr key=${c.code}><td className="code">${c.code}</td><td style=${{ whiteSpace: 'normal', minWidth: '180px' }}>${couponRule(c)}</td><td className="r tab">${c.uses}</td>
            <td><button className="switch" role="switch" aria-checked=${c.active} aria-label=${'Activate ' + c.code} onClick=${() => toggle(c)}></button></td></tr>`)}</tbody>
        </table></div>
        <form className="box stack" onSubmit=${create}>
          <div className="box-h" style=${{ margin: 0 }}><h2>New discount code</h2></div>
          <div className="formgrid">
            <div className="field"><label htmlFor="nc-code">Code</label><input id="nc-code" className="input code" placeholder="SPRING15" value=${nc.code} onChange=${e => setNc(Object.assign({}, nc, { code: e.target.value.toUpperCase() }))}/></div>
            <div className="field"><label htmlFor="nc-type">Type</label><select id="nc-type" className="select" value=${nc.type} onChange=${e => setNc(Object.assign({}, nc, { type: e.target.value }))}>
              <option value="percent">Percent off</option><option value="fixed">Amount off</option><option value="ship">Free shipping</option></select></div>
            ${nc.type !== 'ship' ? html`<div className="field"><label htmlFor="nc-value">${nc.type === 'percent' ? 'Percent' : 'Amount (USD)'}</label><input id="nc-value" className="input" type="number" min="0" value=${nc.value} onChange=${e => setNc(Object.assign({}, nc, { value: e.target.value }))}/></div>` : null}
            <div className="field"><label htmlFor="nc-min">Minimum order (USD)</label><input id="nc-min" className="input" type="number" min="0" placeholder="0" value=${nc.min} onChange=${e => setNc(Object.assign({}, nc, { min: e.target.value }))}/></div>
          </div>
          ${err ? html`<div className="err">${err}</div>` : null}
          <div><button className="btn btn-accent" type="submit"><${Icon} n="tag"/>Create code</button></div>
        </form>
      </div>
      <div className="stack">
        <div className="box stack">
          <div className="box-h" style=${{ margin: 0 }}><h2>Announcement bar</h2><span className="s">Shown above the shop</span></div>
          <div className="field"><label htmlFor="ann">Message</label><textarea id="ann" className="input" rows="3" maxLength="120" value=${ann} onChange=${e => setAnn(e.target.value)}></textarea>
            <div className="hint">${ann.length}/120 characters · leave empty to hide the bar</div></div>
          ${ann.trim() ? html`<div className="preview-strip">${ann}</div>` : null}
          <div><button className="btn btn-accent" disabled=${ann === store.announcement} onClick=${() => { setStore(s => Object.assign({}, s, { announcement: ann })); toast('Announcement updated in the shop'); }}>Save announcement</button></div>
        </div>
        <div className="box stack">
          <div className="box-h" style=${{ margin: 0 }}><h2>Send an offer</h2><span className="s">${store.subscribers} subscribers</span></div>
          ${active.length ? html`<div className="field"><label htmlFor="send-code">Discount code to feature</label>
            <select id="send-code" className="select" value=${send} onChange=${e => setSend(e.target.value)}>${active.map(c => html`<option key=${c.code} value=${c.code}>${c.code} · ${couponRule(c)}</option>`)}</select></div>
            <button className="btn" onClick=${() => toast('Offer with ' + send + ' queued for ' + store.subscribers + ' subscribers (demo, no emails sent)')}><${Icon} n="send"/>Send to subscribers</button>`
            : html`<p className="muted" style=${{ margin: 0 }}>Activate a discount code first.</p>`}
        </div>
      </div>
    </div>
  </div>`;
}

function Admin({ store, setStore, toast, goShop }){
  const [tab, setTab] = useState('overview');
  const pending = store.orders.filter(o => o.status === 'Pending' || o.status === 'Paid').length;
  const tabs = [['overview', 'Overview', 'grid'], ['orders', 'Orders', 'list'], ['products', 'Products', 'box'], ['promotions', 'Promotions', 'tag']];
  const props = { store, setStore, toast, go: setTab };
  return html`<div className="admin">
    <aside className="side">
      <${Brand} sub="Admin" onClick=${() => setTab('overview')}/>
      <nav className="nav" aria-label="Admin sections">${tabs.map(t => html`<button key=${t[0]} aria-current=${tab === t[0] ? 'page' : null} onClick=${() => setTab(t[0])}>
        <${Icon} n=${t[2]}/>${t[1]}${t[0] === 'orders' && pending ? html`<span className="n" title="Orders to fulfil">${pending}</span>` : null}</button>`)}
        <button onClick=${goShop}><${Icon} n="store"/>View shop</button></nav>
      <div className="side-foot">Signed in as <b>Store owner</b><br/>Sample data · resets with “Reset demo”</div>
    </aside>
    <main className="main">
      ${tab === 'overview' ? html`<${Overview} ...${props}/>` : tab === 'orders' ? html`<${Orders} ...${props}/>` : tab === 'products' ? html`<${Products} ...${props}/>` : html`<${Promotions} ...${props}/>`}
    </main>
  </div>`;
}

/* ---------- app ---------- */
function Toasts({ items }){
  return html`<div className="toasts" role="status" aria-live="polite">${items.map(t => html`<div className="toast" key=${t.id}><${Icon} n="check"/>${t.msg}</div>`)}</div>`;
}
const STORE_KEY = 'leaf-lantern-demo-v1', CART_KEY = 'leaf-lantern-cart-v1';
function App(){
  const [view, setView] = useState(() => { try { return location.hash === '#admin' ? 'admin' : 'shop'; } catch (e) { return 'shop'; } });
  const [store, setStore] = useState(() => { const s = load(STORE_KEY); return s && s.v === 1 ? s : freshStore(); });
  const [cart, setCart] = useState(() => load(CART_KEY) || []);
  const [code, setCode] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [armed, setArmed] = useState(false);
  const tid = useRef(0);
  useEffect(() => save(STORE_KEY, store), [store]);
  useEffect(() => save(CART_KEY, cart), [cart]);
  useEffect(() => { try { history.replaceState(null, '', '#' + view); } catch (e) {} }, [view]);
  useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 3500); return () => clearTimeout(t); }, [armed]);
  const toast = msg => { const id = ++tid.current; setToasts(t => t.concat([{ id, msg }]).slice(-3)); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200); };
  const go = v => { setView(v); try { window.scrollTo({ top: 0 }); } catch (e) {} };
  const reset = () => {
    if (!armed) { setArmed(true); return; }
    setStore(freshStore()); setCart([]); setCode(null); setArmed(false); toast('Demo reset to its starting data');
  };
  return html`<div>
    <div className="demobar gutter"><div className="wrap">
      <span className="tag">Demo</span>
      <span className="note">Fictional store with sample data. Try a purchase, then manage it in Admin.</span>
      <div className="seg" role="group" aria-label="Switch view">
        <button aria-pressed=${view === 'shop'} onClick=${() => go('shop')}><${Icon} n="store"/>Shop</button>
        <button aria-pressed=${view === 'admin'} onClick=${() => go('admin')}><${Icon} n="chart"/>Admin</button>
      </div>
      <button className=${'reset' + (armed ? ' armed' : '')} onClick=${reset}>${armed ? 'Click again to reset' : 'Reset demo'}</button>
    </div></div>
    ${view === 'shop'
      ? html`<${Shop} store=${store} setStore=${setStore} cart=${cart} setCart=${setCart} code=${code} setCode=${setCode} toast=${toast} goAdmin=${() => go('admin')}/>`
      : html`<${Admin} store=${store} setStore=${setStore} toast=${toast} goShop=${() => go('shop')}/>`}
    <${Toasts} items=${toasts}/>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
</body>
</html>
